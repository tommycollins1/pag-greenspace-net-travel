name: pag-greenspace-net-travel

channels:
  - conda-forge

dependencies:
  - python=3.12

  # --- geospatial stack (conda-forge is much easier than PyPI for these) ---
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - fiona>=1.10
  - pyogrio>=0.9
  - rtree>=1.2

  # --- data + IO ---
  - pandas>=2.2
  - numpy>=1.26
  - pyarrow>=17.0

  # --- networks + routing ---
  - osmnx>=2.0
  - networkx>=3.3
  - pyrosm>=0.6

  # --- HTTP + progress + parallel ---
  - requests>=2.32
  - tqdm>=4.66
  - joblib>=1.4

  # --- plotting ---
  - matplotlib>=3.9

  - pip
  - pip:
      # routingpy: PyPI-only; conda-forge build conflicts with shapely>=2
      - routingpy>=1.3
      # install this package itself so `from src.get_network_england_osrm...` works
      - -e .
