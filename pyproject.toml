[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pag-greenspace-net-travel"
version = "1.0.0"
description = "Network travel-time pipeline to accessible greenspace for LSOAs in England (GreenRoute dataset)."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Thomas Collins"},
]
keywords = [
    "greenspace", "accessibility", "LSOA", "England",
    "OSRM", "osmnx", "network routing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.10",
    "pyogrio>=0.9",
    "rtree>=1.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "osmnx>=2.0",
    "networkx>=3.3",
    "pyrosm>=0.6",
    "routingpy>=1.3",
    "requests>=2.32",
    "tqdm>=4.66",
    "joblib>=1.4",
    "matplotlib>=3.9",
]

[project.urls]
Homepage      = "https://github.com/tommycollins1/pag-greenspace-net-travel"
Repository    = "https://github.com/tommycollins1/pag-greenspace-net-travel"
Dataset       = "https://doi.org/10.5281/zenodo.22013904"
Documentation = "https://github.com/tommycollins1/pag-greenspace-net-travel#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Repo root is on sys.path so `main_config` (a repo-root file, not a package
# under src/) is importable during tests. Same convention the pipeline uses.
pythonpath = ["."]
testpaths = ["tests"]
